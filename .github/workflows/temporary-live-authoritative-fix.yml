name: Temporary Authoritative Live Signal Fix

on:
  push:
    branches: ['fix/live-authoritative-signal-throughput']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply targeted authoritative-live fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          duration = Path('lib/deriv-duration-registry.ts').read_text()
          duration = duration.replace("const DISCOVERY_TTL_MS = 10 * 60 * 1000;\n", "")
          duration = duration.replace("const cache = new Map<string, { value: DerivDurationDiscovery; expiresAt: number }>();\n", "")
          duration = duration.replace("const inFlight = new Map<string, Promise<DerivDurationDiscovery>>();\n", "")
          start = duration.index('export async function getDerivDurationDiscovery(symbol: string): Promise<DerivDurationDiscovery> {')
          end = duration.index('\nexport function durationToSeconds', start)
          new_fn = '''export async function getDerivDurationDiscovery(symbol: string): Promise<DerivDurationDiscovery> {\n  const normalized = String(symbol ?? '').trim().toUpperCase();\n  if (!normalized) throw new Error('A Deriv symbol is required for duration discovery.');\n\n  try {\n    return await discover(normalized);\n  } catch (error) {\n    if (!isUnsupportedRiseFallSymbol(error)) throw error;\n    return {\n      symbol: normalized,\n      ranges: [],\n      fetchedAt: new Date().toISOString(),\n      source: 'deriv-proposal-probe' as const,\n      warning: error instanceof Error ? error.message : String(error),\n    };\n  }\n}\n'''
          duration = duration[:start] + new_fn + duration[end:]
          Path('lib/deriv-duration-registry.ts').write_text(duration)

          ranking = Path('lib/live-market-ranking.ts').read_text()
          helper = '''function getLiveRankingConcurrency(): number {\n  const configured = Number(process.env.LIVE_RANKING_MAX_CONCURRENCY);\n  if (Number.isSafeInteger(configured) && configured > 0) return Math.min(8, Math.max(1, configured));\n  return 4;\n}\n\nasync function settleWithConcurrency<T>(\n  items: readonly RiseFallSymbolMetadata[],\n  worker: (item: RiseFallSymbolMetadata) => Promise<T>,\n): Promise<PromiseSettledResult<T>[]> {\n  const results = new Array<PromiseSettledResult<T>>(items.length);\n  let cursor = 0;\n  const concurrency = Math.min(getLiveRankingConcurrency(), items.length);\n\n  const run = async () => {\n    while (true) {\n      const index = cursor++;\n      if (index >= items.length) return;\n      try {\n        results[index] = { status: 'fulfilled', value: await worker(items[index]) };\n      } catch (reason) {\n        results[index] = { status: 'rejected', reason };\n      }\n    }\n  };\n\n  await Promise.all(Array.from({ length: concurrency }, () => run()));\n  return results;\n}\n\n'''
          if 'function getLiveRankingConcurrency' not in ranking:
              anchor = 'function isValidPrediction(data: any, expectedSymbol: string): boolean {'
              ranking = ranking.replace(anchor, helper + anchor, 1)
          if 'settleWithConcurrency(eligible' not in ranking:
              ranking = ranking.replace('  const settled = await Promise.allSettled(\n    eligible.map(async (metadata) => {\n', '  const settled = await settleWithConcurrency(eligible, async (metadata) => {\n', 1)
              ranking = ranking.replace('    }),\n  );\n\n  const rankings = settled', '    },\n  );\n\n  const rankings = settled', 1)
          Path('lib/live-market-ranking.ts').write_text(ranking)

          controller = Path('lib/telegram-trade-controller.ts').read_text()
          old_fetch = """      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json',\n        'Cache-Control': 'no-store',\n      },"""
          new_fetch = """      method: 'POST',\n      cache: 'no-store',\n      headers: {\n        'Content-Type': 'application/json',\n        'Cache-Control': 'no-store, no-cache, max-age=0',\n        Pragma: 'no-cache',\n        'x-live-signal-request': 'true',\n      },"""
          if "cache: 'no-store'" not in controller:
              controller = controller.replace(old_fetch, new_fetch, 1)
          Path('lib/telegram-trade-controller.ts').write_text(controller)

          route = Path('app/api/signals/predict/route.ts').read_text()
          old_route = '''    const discovery = await getDerivDurationDiscovery(symbol);\n    const durationOptions = buildServerDurationOptions(discovery);'''
          new_route = '''    let discovery: Awaited<ReturnType<typeof getDerivDurationDiscovery>>;\n    try {\n      discovery = await getDerivDurationDiscovery(symbol);\n    } catch (error) {\n      console.error(\n        `[Signal Duration Discovery Error] correlationId=${correlationId} symbol=${symbol}:`,\n        error instanceof Error ? error.message : String(error),\n      );\n      throw error;\n    }\n    if (!discovery.ranges.length) {\n      console.error(\n        `[Signal Duration Discovery Unavailable] correlationId=${correlationId} symbol=${symbol}: ${discovery.warning || 'No broker-validated Rise/Fall durations returned.'}`,\n      );\n    }\n    const durationOptions = buildServerDurationOptions(discovery);'''
          if '[Signal Duration Discovery Unavailable]' not in route:
              route = route.replace(old_route, new_route, 1)
          Path('app/api/signals/predict/route.ts').write_text(route)

          test = Path('scripts/tests/live-signal-no-cache-invariants.mjs').read_text()
          if "const durationRegistry = read('lib/deriv-duration-registry.ts');" not in test:
              test = test.replace("const predictionRoute = read('app/api/signals/predict/route.ts');", "const predictionRoute = read('app/api/signals/predict/route.ts');\nconst durationRegistry = read('lib/deriv-duration-registry.ts');")
          if 'DISCOVERY_TTL_MS' not in test:
              test = test.replace("  'confidence || 50',\n];", "  'confidence || 50',\n  'DISCOVERY_TTL_MS',\n  'const cache = new Map<string, { value: DerivDurationDiscovery; expiresAt: number }>();',\n  'const inFlight = new Map<string, Promise<DerivDurationDiscovery>>();',\n];")
          if "const controller = read('lib/telegram-trade-controller.ts');" not in test:
              test = test.replace("const ranking = read('lib/live-market-ranking.ts');", "const ranking = read('lib/live-market-ranking.ts');\nconst controller = read('lib/telegram-trade-controller.ts');")
          if "Live signal throughput invariant failed" not in test:
              anchor = 'if (!compatibility.includes("from \'./live-market-ranking\'")) {'
              insertion = """if (!durationRegistry.includes('return await discover(normalized);')) {\n  throw new Error('Live signal no-cache invariant failed: duration discovery is not direct per invocation.');\n}\nif (!ranking.includes('settleWithConcurrency')) {\n  throw new Error('Live signal throughput invariant failed: ranking fan-out is unbounded.');\n}\nif (!controller.includes(\"cache: 'no-store'\")) {\n  throw new Error('Telegram live-signal invariant failed: direct signal request is not explicitly no-store.');\n}\nif (!predictionRoute.includes('[Signal Duration Discovery Unavailable]')) {\n  throw new Error('Live signal diagnostic invariant failed: duration discovery failures are not explicitly logged.');\n}\n"""
              test = test.replace(anchor, insertion + anchor, 1)
          Path('scripts/tests/live-signal-no-cache-invariants.mjs').write_text(test)
          PY

      - name: Verify targeted source invariants
        run: |
          node scripts/tests/live-signal-no-cache-invariants.mjs
          node scripts/tests/telegram-symbol-universe-invariants.mjs
          npx tsc --noEmit --pretty false
          npm run build

      - name: Review diff and commit
        run: |
          git diff --check
          git diff -- lib/deriv-duration-registry.ts lib/live-market-ranking.ts lib/telegram-trade-controller.ts app/api/signals/predict/route.ts scripts/tests/live-signal-no-cache-invariants.mjs
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/deriv-duration-registry.ts lib/live-market-ranking.ts lib/telegram-trade-controller.ts app/api/signals/predict/route.ts scripts/tests/live-signal-no-cache-invariants.mjs
          if git diff --cached --quiet; then echo 'No source changes required.'; exit 0; fi
          git diff --cached --check
          git commit -m 'fix(signals): enforce fresh bounded authoritative market analysis'
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}

# verification-revision-2