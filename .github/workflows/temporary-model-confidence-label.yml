name: Temporary Telegram Model Confidence Label Fix

on:
  push:
    branches: ['fix/telegram-model-confidence-label']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply exact Telegram display corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/telegram-trade-controller.ts')
          s = p.read_text()
          replacements = {
              'Calibrating win probabilities...': 'Validating live model confidence...',
              'Target Locked: Loading highest win-rate assets... ⏳': 'Target Locked: Ranking highest-confidence live signals... ⏳',
              'Win rate = *${res.winRate}%*': 'Model confidence = *${res.winRate}%*',
              'Highest chance to win right now:': 'Highest-confidence live signals right now:',
              "escapeMarkdown(rankingSnapshot.modelVersion || 'v2-production')": 'escapeMarkdown(rankingSnapshot.modelVersion)',
          }
          changed = False
          for old, new in replacements.items():
              old_count = s.count(old)
              new_count = s.count(new)
              if old_count == 1 and new_count == 0:
                  s = s.replace(old, new)
                  changed = True
              elif old_count == 0 and new_count == 1:
                  continue
              else:
                  raise SystemExit(f'Unexpected occurrence state for {old!r}: old={old_count}, new={new_count}')
          if changed:
              p.write_text(s)
          else:
              print('Source corrections already applied; no source mutation required.')
          PY

      - name: Verify exact corrections
        run: |
          grep -Fq 'Model confidence = *${res.winRate}%*' lib/telegram-trade-controller.ts
          grep -Fq 'Validating live model confidence...' lib/telegram-trade-controller.ts
          grep -Fq 'Ranking highest-confidence live signals...' lib/telegram-trade-controller.ts
          grep -Fq 'Highest-confidence live signals right now:' lib/telegram-trade-controller.ts
          ! grep -Fq "rankingSnapshot.modelVersion || 'v2-production'" lib/telegram-trade-controller.ts
          ! grep -Fq 'Win rate = *${res.winRate}%*' lib/telegram-trade-controller.ts

      - name: Commit source correction when needed
        run: |
          if git diff --quiet -- lib/telegram-trade-controller.ts; then
            echo 'No source diff; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/telegram-trade-controller.ts
          git diff --cached --check
          git diff --cached -- lib/telegram-trade-controller.ts
          git commit -m 'fix(telegram): label model confidence accurately'
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
